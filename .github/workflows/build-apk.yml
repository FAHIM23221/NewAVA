name: Build AVA OS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Unzip project and build debug APK
        run: |
          if ls AVA_OS.zip.b64.part* 1>/dev/null 2>&1; then cat AVA_OS.zip.b64.part* | base64 -d > AVA_OS.zip; fi
          if [ -f AVA_OS.zip ]; then unzip -q -o AVA_OS.zip; fi
          if [ -d AVA_OS ]; then cd AVA_OS; fi
          echo "Building in: $PWD"
          ls
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
          echo "APK_PATH=$PWD/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVA-OS-debug-apk
          path: ${{ env.APK_PATH }}
